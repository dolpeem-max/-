<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบจำลองสอบใบประกอบวิชาชีพครู</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --correct-bg: #d4edda;
            --correct-border: #c3e6cb;
            --correct-text: #155724;
            --incorrect-bg: #f8d7da;
            --incorrect-border: #f5c6cb;
            --incorrect-text: #721c24;
            --hover-bg: #f1f3f5;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .question-card {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #ddd;
        }

        .context-box {
            background-color: #e9ecef;
            padding: 20px;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #222;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 16px;
            background-color: #fff;
        }

        .option:hover:not(.disabled) {
            background-color: var(--hover-bg);
            border-color: #bdc3c7;
        }

        .option.correct {
            background-color: var(--correct-bg);
            border-color: var(--correct-border);
            color: var(--correct-text);
            font-weight: 600;
        }

        .option.incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect-border);
            color: var(--incorrect-text);
        }

        .option.disabled {
            pointer-events: none;
        }
        
        .feedback {
            margin-top: 10px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>แบบทดสอบจำลองสอบใบประกอบวิชาชีพครู</h1>
        <div id="exam-container"></div>
    </div>

    <script>
        // Array จัดเก็บข้อมูลข้อสอบ (สามารถ Push ข้อมูลชุดต่อไปเข้ามาในตัวแปรนี้ได้เลย)
        const questions = [
            {
                id: 1,
                context: `พิจารณาสถานการณ์ต่อไปนี้แล้วตอบคำถามข้อที่ 1 - 5<br>
                โรงเรียน ก. เป็นโรงเรียนมัธยมศึกษาขนาดกลางที่มีชื่อเสียงด้านนวัตกรรมและเทคโนโลยี ได้ดำเนินการประกันคุณภาพภายในอย่างต่อเนื่องทุกปีการศึกษา โดยจัดทำรายงานการประเมินตนเอง (SAR) และนำผลไปใช้วางแผนพัฒนาการจัดการศึกษาอย่างสม่ำเสมอ ในปีการศึกษาล่าสุด รายงาน SAR ของโรงเรียนสะท้อนผลการประเมินตนเองใน 3 มาตรฐานหลัก ดังนี้<br>
                - มาตรฐานที่ 1 คุณภาพของผู้เรียน อยู่ในระดับดี โดยมีผลสัมฤทธิ์ทางการเรียนเฉลี่ยในระดับสูง และผู้เรียนได้รับรางวัลจากการแข่งขันทางวิชาการหลายรายการ แต่ยังมีจุดอ่อนด้านคุณลักษณะอันพึงประสงค์บางประการ เช่น ความรับผิดชอบต่อส่วนรวม และการทำงานร่วมกับผู้อื่น<br>
                - มาตรฐานที่ 2 กระบวนการบริหารและการจัดการ อยู่ในระดับดี ผู้บริหารมีวิสัยทัศน์ มีการบริหารจัดการที่เป็นระบบ แต่กระบวนการชุมชนแห่งการเรียนรู้ทางวิชาชีพ (PLC) ของครูยังไม่เข้มแข็งพอที่จะนำไปสู่การพัฒนานวัตกรรมการสอนที่ส่งผลต่อผู้เรียนได้อย่างเป็นรูปธรรม คะแนนในภาพรวมของมาตรฐานนี้จึงน้อยกว่ามาตรฐานอื่นเล็กน้อย<br>
                - มาตรฐานที่ 3 กระบวนการจัดการเรียนการสอนที่เน้นผู้เรียนเป็นสำคัญ อยู่ในระดับดีเลิศ ครูมีความเชี่ยวชาญในการผลิตและใช้สื่อเทคโนโลยีที่ทันสมัย ทำให้บรรยากาศในห้องเรียนน่าสนใจและเอื้อต่อการเรียนรู้<br>
                ต่อมา สำนักงานรับรองมาตรฐานและประเมินคุณภาพการศึกษา (สมศ.) ได้เข้ามาประเมินคุณภาพภายนอก และได้ให้ข้อเสนอแนะโดยสรุปว่า ผลการประเมินคุณภาพภายนอกสอดคล้องกับรายงาน SAR ของสถานศึกษา โดยภาพรวมอยู่ในระดับดี โดยเฉพาะอย่างยิ่งการจัดการเรียนการสอนและการใช้สื่ออยู่ในระดับดีเลิศ`,
                question: "1. จากสถานการณ์ดังกล่าว จากข้อเสนอแนะของ สมศ. และผลการประเมินตนเอง ข้อใดคือสิ่งที่โรงเรียน ก. ควรพัฒนาตามความสัมพันธ์ของการประกันคุณภาพภายนอกและภายใน อย่างเร่งด่วนที่สุด",
                options: {
                    "ก": "พัฒนาการใช้สื่อและเทคโนโลยีให้ดียิ่งขึ้นไปอีก เพื่อคงความเป็นเลิศไว้",
                    "ข": "พัฒนาการเขียนรายงาน SAR ให้สะท้อนคุณภาพของโรงเรียนได้ดียิ่งขึ้น",
                    "ค": "พัฒนาการสร้างบรรยากาศห้องเรียนเชิงบวก เพื่อส่งเสริมการเรียนรู้ของผู้เรียน",
                    "ง": "พัฒนาคุณภาพผู้เรียน แม้คะแนนจะดีแล้ว แต่ยังเป็นข้อเสนอแนะหลักของ สมศ.",
                    "จ": "พัฒนากระบวนการ PLC เพราะคะแนนในภาพรวมน้อย แสดงว่าการบริหารยังขาดการพัฒนา"
                },
                answer: "จ"
            },
            {
                id: 2,
                question: "2. จากสถานการณ์ดังกล่าว การที่ สมศ. เสนอแนะให้นำจุดแข็งด้านสื่อมาใช้พัฒนาผู้เรียนสะท้อนแนวคิดใดเป็นสำคัญที่สุด",
                options: {
                    "ก": "การประกันคุณภาพภายนอกมุ่งเน้นการตรวจสอบการทำงานของครู",
                    "ข": "การพัฒนาต้องเริ่มจากจุดที่อ่อนที่สุดก่อนเสมอเพื่อให้เกิดความสมดุล",
                    "ค": "การพัฒนาคุณภาพสามารถต่อยอดจากจุดแข็งเพื่อมาจุดที่ต้องพัฒนาได้",
                    "ง": "สื่อและเทคโนโลยีคือหัวใจหลักของการประเมินคุณภาพการศึกษายุคใหม่",
                    "จ": "คุณภาพผู้เรียนมีปัจจัยสำคัญมาจากสื่อการเรียนรู้ที่มีคุณภาพ"
                },
                answer: "ค"
            },
            {
                id: 3,
                question: "3. หากท่านเป็นผู้บริหารโรงเรียน ก. จะเลือกใช้กลไกใดเป็นเครื่องมือหลักในการดำเนินการตามข้อเสนอแนะของ สมศ. ให้เกิดประสิทธิภาพสูงสุด",
                options: {
                    "ก": "จัดสรรงบประมาณเพื่อจัดซื้อสื่อและอุปกรณ์ที่ทันสมัยเพิ่มเติมจากเดิม",
                    "ข": "จัดอบรมการใช้เทคโนโลยีและนวัตกรรมเพิ่มเติมให้แก่คณะครูอย่างเข้มข้น",
                    "ค": "ตั้งคณะกรรมการชุดใหม่เพื่อประเมินคุณลักษณะอันพึงประสงค์ของผู้เรียน",
                    "ง": "สร้างวงจร PLC ที่เข้มแข็งให้ครูร่วมกันออกแบบกิจกรรมที่ใช้สื่อพัฒนาผู้เรียน",
                    "จ": "ประกาศนโยบายให้ครูทุกคนต้องพัฒนานวัตกรรมของตนเองในทุกปีการศึกษา"
                },
                answer: "ง"
            },
            {
                id: 4,
                question: "4. จากสถานการณ์ดังกล่าว ข้อใดเป็นความท้าทายที่สำคัญที่สุดของโรงเรียน ก. ในการยกระดับคุณภาพตามข้อเสนอแนะ",
                options: {
                    "ก": "การรักษามาตรฐานการใช้สื่อและเทคโนโลยีให้อยู่ในระดับดีเลิศต่อไป",
                    "ข": "การแสวงหางบประมาณเพิ่มเติมเพื่อรองรับโครงการพัฒนาคุณภาพต่าง ๆ",
                    "ค": "การสร้างความเข้าใจให้ผู้ปกครองยอมรับแนวทางการพัฒนาใหม่ของโรงเรียน",
                    "ง": "การทำให้ครูเห็นความสำคัญของการพัฒนาคุณลักษณะอันพึงประสงค์ของผู้เรียน",
                    "จ": "การเปลี่ยนกระบวนการ PLC จากรูปแบบเดิมให้เป็นการทำงานร่วมกันอย่างแท้จริง"
                },
                answer: "จ"
            },
            {
                id: 5,
                question: "5. การดำเนินการของโรงเรียน ก. สะท้อนหลักการสำคัญของการประกันคุณภาพการศึกษาในข้อใด",
                options: {
                    "ก": "การประเมินเพื่อตัดสินและจัดอันดับสถานศึกษาที่มีคุณภาพแตกต่างกัน",
                    "ข": "การดำเนินงานตามคำสั่งของผู้ประเมินภายนอกอย่างเคร่งครัดทุกขั้นตอน",
                    "ค": "การมุ่งเน้นพัฒนาเฉพาะมาตรฐานที่ได้คะแนนน้อยที่สุดเพื่อยกระดับภาพรวม",
                    "ง": "การสร้างเอกลักษณ์ของสถานศึกษาให้โดดเด่นด้านใดด้านหนึ่งเพียงด้านเดียว",
                    "จ": "การพัฒนาอย่างต่อเนื่องโดยใช้ผลการประเมินตนเองควบคู่กับข้อเสนอแนะภายนอก"
                },
                answer: "จ"
            },
	        {
                id: 6,
                context: `พิจารณาสถานการณ์ต่อไปนี้แล้วตอบคำถามข้อที่ 6 - 11<br>
                ผลการประเมินคุณภาพการศึกษาและคะแนนสอบระดับชาติแสดงให้เห็นถึงความแตกต่างระหว่างนักเรียนในเขตเมืองและนักเรียนในพื้นที่ชนบทห่างไกลอย่างชัดเจน<br>
                โรงเรียนแรก คือ โรงเรียนพัฒนานคร ตั้งอยู่ใจกลางจังหวัดเศรษฐกิจสำคัญ โรงเรียนแห่งนี้เพียบพร้อมไปด้วยทรัพยากรทางการศึกษา บุคลากรครูส่วนใหญ่มีวุฒิการศึกษาระดับปริญญาโท สอนตรงตามสาขาวิชาเอก และมีอัตราการย้ายงานต่ำมาก ห้องเรียนทุกห้องเป็นห้องเรียนปรับอากาศ พร้อมสมาร์ทบอร์ด นักเรียนทุกคนมีแท็บเล็ตส่วนตัวเพื่อการเรียนรู้ และมีอินเทอร์เน็ตความเร็วสูงครอบคลุมทั่วทั้งโรงเรียน กิจกรรมการเรียนการสอนเน้นการส่งเสริมทักษะแห่งศตวรรษที่ 21 ทำให้นักเรียนมีผลสัมฤทธิ์ทางการเรียนสูง และกว่าร้อยละ 80 สามารถสอบเข้าศึกษาต่อในมหาวิทยาลัยที่มีชื่อเสียงได้สำเร็จ<br>
                ในทางตรงกันข้าม โรงเรียนบ้านไกลเป็นโรงเรียนขยายโอกาสในตำบลที่ห่างไกลจากตัวจังหวัดหลายร้อยกิโลเมตร โรงเรียนแห่งนี้ประสบปัญหาขาดแคลนครูอย่างต่อเนื่อง ครูหลายคนต้องสอนควบชั้นและสอนในวิชาที่ตนเองไม่ถนัด อัตราการย้ายเข้า - ออกของครูสูง ทำให้การพัฒนาการสอนไม่ต่อเนื่อง สื่อและอุปกรณ์การเรียนรู้มีจำกัด ห้องคอมพิวเตอร์มีเครื่องที่ใช้งานได้จริงไม่ถึงครึ่งและอินเทอร์เน็ตมีความเร็วต่ำมาก แม้ว่านักเรียนที่นี่จะมีศักยภาพและความมุ่งมั่น แต่กลับขาดโอกาสในการเข้าถึงแหล่งเรียนรู้ที่ทันสมัยและมีคุณภาพ ทำให้ผลสัมฤทธิ์ทางการเรียนโดยรวมอยู่ในระดับที่ต้องปรับปรุงและมีนักเรียนเพียงไม่กี่คนที่ได้เรียนต่อในระดับอุดมศึกษา`,
                question: "6. จากสถานการณ์ดังกล่าว ข้อใดเป็นการเริ่มต้นแก้ไขปัญหาอย่างเป็นระบบที่มีประสิทธิภาพสูงสุด",
                options: {
                    "ก": "จัดสรรงบประมาณเพื่อจัดซื้อคอมพิวเตอร์และแท็บเล็ตให้โรงเรียนบ้านไกลทันที",
                    "ข": "ปรับหลักสูตรแกนกลางการศึกษาขั้นพื้นฐานให้มีความยืดหยุ่นเหมาะกับทุกบริบท",
                    "ค": "แต่งตั้งคณะทำงานลงพื้นที่เพื่อประเมินความต้องการที่แท้จริงของโรงเรียนบ้านไกล",
                    "ง": "ออกนโยบายบังคับให้ครูบรรจุใหม่ต้องไปปฏิบัติหน้าที่ในโรงเรียนชนบทเป็นเวลา 5 ปี",
                    "จ": "สร้างแพลตฟอร์มการเรียนรู้ส่วนกลางที่รวมสื่อการสอนคุณภาพสูงไว้ให้นักเรียนทุกคน"
                },
                answer: "ค"
            },
            {
                id: 7,
                question: "7. จากสถานการณ์ดังกล่าว เพื่อแก้ไขปัญหาครูไม่ครบชั้นและสอนไม่ตรงวิชาเอกที่โรงเรียนบ้านไกล แนวทางใดจะสร้างความยั่งยืนได้มากที่สุด",

            {

                context: `พิจารณาสถานการณ์ต่อไปนี้แล้วตอบคำถามข้อที่ 23 - 28<br>

                context: `พิจารณาสถานการณ์ต่อไปนี้แล้วตอบคำถามข้อที่ 29 - 34<br>

                โรงเรียนแห่งหนึ่งเป็นโรงเรียนขนาดเล็กในพื้นที่ห่างไกล ประสบปัญหาขาดแคลนบุคลากรครูอย่างต่อเนื่อง ส่งผลให้ครูหนึ่งคนต้องรับผิดชอบภาระงานหลายด้าน ทั้งงานสอนควบระดับชั้น งานธุรการ งานพัสดุ และงานโครงการต่าง ๆ ทำให้เวลาในการเตรียมการสอนและดูแลนักเรียนในห้องเรียนมีจำกัดอย่างยิ่ง<br>

{
                id: 66,
                context: `พิจารณาสถานการณ์ต่อไปนี้แล้วตอบคำถามข้อที่ 66 - 72<br>
                บรรยากาศในห้องเรียนของครูแต่ละท่านมีลักษณะแตกต่างกันอย่างชัดเจน ดังนี้<br>
                1) ห้องเรียนครูลิลลี่ ใช้รูปแบบการจัดการเรียนรู้แบบบรรยาย ครูยืนอยู่หน้าชั้นเรียนและใช้สไลด์นำเสนอข้อมูลเกี่ยวกับสาเหตุและผลกระทบของปัญหาสิ่งแวดล้อมต่าง ๆ อย่างเป็นระบบ นักเรียนนั่งฟังและจดบันทึกตามเนื้อหาที่ครูพูด มีการเปิดโอกาสให้นักเรียนซักถามในช่วงท้ายคาบ เป็นรูปแบบที่เน้นการถ่ายทอดความรู้จากครูไปยังนักเรียนเป็นหลัก<br>
                2) ห้องเรียนครูเดซี่ ใช้รูปแบบการจัดการเรียนรู้แบบร่วมมือ (Cooperative Learning) หลังจากที่ครูนำเสนอประเด็นปัญหาเบื้องต้นแล้ว ได้แบ่งนักเรียนออกเป็นกลุ่มคละความสามารถ (กลุ่มเก่ง กลุ่มปานกลาง และกลุ่มอ่อน) แต่ละกลุ่มได้รับใบงานชุดเดียวกันเพื่อช่วยกันศึกษาและทำความเข้าใจเนื้อหา เป้าหมายของกลุ่มคือการทำให้สมาชิกทุกคนเข้าใจบทเรียนอย่างถ่องแท้ เพื่อทำคะแนนทดสอบย่อยรายบุคคลให้ได้ดีที่สุด ทั้งนี้คะแนนของทุกคนจะถูกนำมาคิดเป็นคะแนนพัฒนาการของทีม<br>

        // ฟังก์ชันสำหรับ Render ข้อสอบออกสู่หน้าเว็บ
        function renderExam() {
            const container = document.getElementById('exam-container');
            
            questions.forEach((q, index) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';
                questionCard.id = `question-${q.id}`;

                // ถ้ามี context (สถานการณ์จำลอง) ให้แสดง Box
                if (q.context) {
                    const contextBox = document.createElement('div');
                    contextBox.className = 'context-box';
                    contextBox.innerHTML = q.context;
                    questionCard.appendChild(contextBox);
                }

                // โจทย์
                const questionText = document.createElement('div');
                questionText.className = 'question-text';
                questionText.innerText = q.question;
                questionCard.appendChild(questionText);

                // ตัวเลือก
                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options-container';

                for (const [key, value] of Object.entries(q.options)) {
                    const optionBtn = document.createElement('div');
                    optionBtn.className = 'option';
                    optionBtn.dataset.key = key;
                    optionBtn.innerHTML = `<strong>${key}.</strong> ${value}`;
                    
                    // Logic เมื่อคลิกเลือกคำตอบ
                    optionBtn.onclick = function() {
                        checkAnswer(this, key, q.answer, optionsContainer);
                    };

                    optionsContainer.appendChild(optionBtn);
                }

                questionCard.appendChild(optionsContainer);
                container.appendChild(questionCard);
            });
        }

        // ฟังก์ชันตรวจคำตอบและเปลี่ยนสี
        function checkAnswer(selectedElement, selectedKey, correctKey, container) {
            const allOptions = container.querySelectorAll('.option');
            
            // ล็อกทุกตัวเลือกไม่ให้กดซ้ำได้อีก
            allOptions.forEach(opt => opt.classList.add('disabled'));

            if (selectedKey === correctKey) {
                // ตอบถูก -> สีเขียว
                selectedElement.classList.add('correct');
            } else {
                // ตอบผิด -> สีแดง และไฮไลต์ข้อที่ถูกเป็นสีเขียว
                selectedElement.classList.add('incorrect');
                allOptions.forEach(opt => {
                    if (opt.dataset.key === correctKey) {
                        opt.classList.add('correct');
                    }
                });
            }
        }

        // สั่งทำงานเมื่อโหลดหน้า
        window.onload = renderExam;
    </script>
